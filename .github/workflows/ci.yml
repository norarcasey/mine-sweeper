name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. new pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The same command as `yarn gate` locally, so the two cannot disagree.
      - name: Gate
        run: yarn gate

      - name: Build library
        run: yarn ts-build

      - name: Build Storybook
        run: yarn build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'

  # The iPhone half: MineSweeperKit's swift test and the app's unit tests,
  # the same `ios/test.sh gate` as on the laptop. The UI tests run in local
  # `yarn verify` only: macOS minutes cost ten times Linux ones (MINE-3).
  ios:
    name: iOS gate
    runs-on: macos-26
    timeout-minutes: 20 # the gate ran 7 min on macos-26 (measured 19 Oct 2026, MINE-3)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Gate
        run: ios/test.sh gate
